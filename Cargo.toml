[workspace]
resolver = "3"
members = ["crates/chainsim", "crates/chainsim-aptos", "crates/chainsim-core", "crates/chainsim-evm", "crates/chainsim-hyperproxy", "crates/chainsim-solana", "crates/chainsim-sui"]

[workspace.package]
version = "0.1.13"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
alloy-primitives = "1"
async-trait = "0.1"
bollard = "0.21"
curve25519-dalek = { version = "4", default-features = false }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
chainsim-aptos = { path = "crates/chainsim-aptos" }
chainsim-core = { path = "crates/chainsim-core" }
chainsim-evm = { path = "crates/chainsim-evm" }
chainsim-hyperproxy = { path = "crates/chainsim-hyperproxy" }
chainsim-solana = { path = "crates/chainsim-solana" }
chainsim-sui = { path = "crates/chainsim-sui" }
