# Sketch: run the Foundry unit tests and the e2e script against a fresh HyperEVM mainnet fork on
# every push. chainsim starts the fork in Docker on the runner and publishes its RPC on 127.0.0.1.
name: hyperevm-fork-tests
on: [push, pull_request]
jobs:
  fork-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.8.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn, cache-dependency-path: e2e/yarn.lock }
      - name: Install chainsim
        run: |
          curl -fsSL https://raw.githubusercontent.com/MatrixLabsTech/chainsim/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git
      - name: Fork, test, remove
        # Set CHAINSIM_HYPEREVM_MAINNET_RPC from a secret to read through a provider instead of the public RPC.
        env:
          CHAINSIM_PUBLISH: "1"
        run: scripts/test.sh
